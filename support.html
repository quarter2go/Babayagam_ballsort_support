<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Babayagam Support</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 24px;
            display: flex;
            align-items: center;
            justify-content: center;

            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                         "SF Pro Text", Arial, sans-serif;

            background: #0b1028;
            color: white;
        }

        .container {
            width: 100%;
            max-width: 680px;
            text-align: center;
        }

        .icon {
            width: 110px;
            height: 110px;
            border-radius: 26px;
            object-fit: cover;
            margin-bottom: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
        }

        h1 {
            margin: 0 0 10px;
            font-size: 42px;
            letter-spacing: -1px;
        }

        .subtitle {
            margin-bottom: 40px;
            color: #aeb7d8;
            font-size: 18px;
        }

        .card {
            padding: 32px;
            text-align: left;

            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 28px;

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        h2 {
            margin-top: 0;
            font-size: 24px;
        }

        p {
            color: #c4cae0;
            font-size: 16px;
            line-height: 1.7;
        }

        .contact {
            display: inline-block;
            margin-top: 14px;
            padding: 14px 22px;

            border-radius: 16px;
            background: rgba(255, 255, 255, 0.12);

            color: white;
            text-decoration: none;

            transition: 0.2s ease;
        }

        .contact:hover {
            background: rgba(255, 255, 255, 0.20);
            transform: translateY(-2px);
        }

        .links {
            margin-top: 24px;
        }

        .links a {
            color: #aeb7d8;
            text-decoration: none;
            margin: 0 8px;
        }

        footer {
            margin-top: 28px;
            color: #737c9d;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <main class="container">

        <img src="icon.png" alt="Babayagam" class="icon">

        <h1>Babayagam Support</h1>

        <div class="subtitle">
            Ball Sort: Babayagam
        </div>

        <section class="card">

            <h2>Need Help?</h2>

            <p>
                If you have questions, encounter a problem,
                or need assistance with Babayagam, please contact us.
            </p>

            <a
                class="contact"
                href="mailto:quarter2go@gmail.com"
            >
                Contact Support
            </a>

        </section>

        <div class="links">
            <a href="privacy.html">Privacy Policy</a>
        </div>

        <footer>
            © 2026 Goravith Karakhun
        </footer>

    </main>

</body>
</html>
